<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.28; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.55; transform: scale(1.15) translate(25px, -15px); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes sweepGlow {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #ec4899; }
      100% { stop-color: #38bdf8; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
    .pill-anim-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-anim-2 { animation: floatPill2 6s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #f1f5f9;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #64748b;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (in Background) -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="#0284c7" filter="url(#orbGlow)" />
  <circle class="orb-2" cx="1020" cy="280" r="160" fill="#7c3aed" filter="url(#orbGlow)" />
  <circle class="orb-1" cx="620" cy="380" r="110" fill="#059669" filter="url(#orbGlow)" />

  <!-- Geometric Grid Accent Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Connecting Animated Dynamic Flow Lines (behind text) -->
  <path class="flow-line" d="M 120 340 Q 300 370 500 340 T 900 340 T 1100 320" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4" />
  <path class="flow-line" d="M 80 80 Q 320 40 600 80 T 1120 70" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.3" />

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Badge: Category Focus -->
  <g transform="translate(420, 36)">
    <rect width="360" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="15" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.6">
      ENTERPRISE GRC &amp; OPEN-SOURCE GOVERNANCE
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 115)">
    <text text-anchor="middle" class="title-text" fill="#ffffff">
      Awesome Data Compliance &amp; Governance
    </text>
    <text text-anchor="middle" y="42" class="title-text" fill="url(#primaryGrad)">
      Management Ecosystem
    </text>
  </g>

  <!-- Subtitle / Mission Statement -->
  <text x="600" y="200" text-anchor="middle" class="subtitle-text">
    Curated Hub for GRC Automation • Evidence Collection • SOC 2, ISO 27001, GDPR &amp; HIPAA Frameworks
  </text>

  <!-- Animated Feature / Framework Pills -->
  <g class="pill-anim-1" transform="translate(180, 230)">
    <rect width="130" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="65" y="21" text-anchor="middle" class="pill-text" fill="#38bdf8">🛡️ SOC 2 &amp; ISO</text>
  </g>

  <g class="pill-anim-2" transform="translate(330, 230)">
    <rect width="150" height="34" rx="17" fill="url(#badgeGrad2)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" />
    <text x="75" y="21" text-anchor="middle" class="pill-text" fill="#c084fc">⚖️ GDPR &amp; HIPAA</text>
  </g>

  <g class="pill-anim-1" transform="translate(500, 230)">
    <rect width="180" height="34" rx="17" fill="url(#badgeGrad3)" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <text x="90" y="21" text-anchor="middle" class="pill-text" fill="#34d399">🤖 AI &amp; MCP Tooling</text>
  </g>

  <g class="pill-anim-2" transform="translate(700, 230)">
    <rect width="170" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="85" y="21" text-anchor="middle" class="pill-text" fill="#38bdf8">📊 Automated Evidence</text>
  </g>

  <g class="pill-anim-1" transform="translate(890, 230)">
    <rect width="130" height="34" rx="17" fill="url(#badgeGrad2)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" />
    <text x="65" y="21" text-anchor="middle" class="pill-text" fill="#c084fc">🌐 100% Open Core</text>
  </g>

  <!-- Bottom Architecture Flow Cards (Visual Anchor) -->
  <g transform="translate(140, 295)">
    <!-- Card 1 -->
    <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="18" y="30" class="card-title">📁 Data Discovery &amp; Catalog</text>
    <text x="18" y="52" class="card-desc">Asset metadata, column lineage,</text>
    <text x="18" y="68" class="card-desc">OpenMetadata &amp; DataHub integration</text>

    <!-- Connector Arrow -->
    <path d="M 215 42 L 235 42" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Card 2 -->
    <g transform="translate(250, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="18" y="30" class="card-title">⚙️ Policy &amp; Evidence Engine</text>
      <text x="18" y="52" class="card-desc">Continuous audit trail mapping,</text>
      <text x="18" y="68" class="card-desc">Prowler, Cloud Custodian &amp; Comp AI</text>
    </g>

    <!-- Connector Arrow -->
    <path d="M 465 42 L 485 42" stroke="#64748b" stroke-width="2" />

    <!-- Card 3 -->
    <g transform="translate(500, 0)">
      <rect width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="18" y="30" class="card-title">🔐 Enterprise GRC Lifecycle</text>
      <text x="18" y="52" class="card-desc">Risk register, DPIA, vendor risk,</text>
      <text x="18" y="68" class="card-desc">Probo, CISO Assistant &amp; ServiceNow</text>
    </g>

    <!-- Connector Arrow -->
    <path d="M 715 42 L 735 42" stroke="#64748b" stroke-width="2" />

    <!-- Card 4 -->
    <g transform="translate(750, 0)">
      <rect width="170" height="85" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="18" y="30" class="card-title">📑 Audit-Ready Reports</text>
      <text x="18" y="52" class="card-desc">SOC 2 Type II, ISO 27001,</text>
      <text x="18" y="68" class="card-desc">Real-time auditor dashboards</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />
</svg>
